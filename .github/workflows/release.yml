name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Calculate a version without committing, tagging, or publishing"
        required: true
        type: boolean
        default: false

concurrency:
  group: provider-usage-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$CURRENT_REF" = "refs/heads/main" || {
            echo "Run releases from main, not $CURRENT_REF." >&2
            exit 1
          }

      - name: Check out plugin and release tags
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin
          fetch-depth: 0

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev SDK source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kdlbs/kandev
          path: kandev
          ref: ${{ steps.sdk.outputs.ref }}
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Compute release version
        id: version
        working-directory: plugin
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -nE 's/^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' manifest.yaml)"
          sh scripts/verify-release-version.sh "v$CURRENT_VERSION"

          LATEST_TAG="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          BASELINE="$CURRENT_VERSION"
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            BASELINE="$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | tail -n 1)"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASELINE"
          case "$BUMP" in
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          TAG="v$NEXT"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists locally: $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists on origin: $TAG" >&2
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Latest release tag: ${LATEST_TAG:-none}"
          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        run: echo "Would validate, commit, tag, and publish ${{ steps.version.outputs.tag }}."

      - name: Update release metadata and changelog
        if: ${{ !inputs.dry_run }}
        working-directory: plugin
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -nE 's/^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' manifest.yaml)"
          sed -i -E "s/^version: \"[0-9]+\.[0-9]+\.[0-9]+\"$/version: \"$NEXT_VERSION\"/" manifest.yaml
          sed -i -E "s/^VERSION := [0-9]+\.[0-9]+\.[0-9]+$/VERSION := $NEXT_VERSION/" Makefile
          sed -i "s/kandev-provider-usage-$CURRENT_VERSION.tar.gz/kandev-provider-usage-$NEXT_VERSION.tar.gz/" README.md

          if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..HEAD"; else RANGE=HEAD; fi
          CHANGES="$(git log --no-merges --format='- %s (%h)' "$RANGE")"
          test -n "$CHANGES" || CHANGES="- Initial release"
          {
            echo "# Changelog"
            echo
            printf '## [%s] - %s\n\n' "$NEXT_VERSION" "$(date -u +%F)"
            echo "### Changed"
            echo
            printf '%s\n' "$CHANGES"
            echo
            test ! -f CHANGELOG.md || tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Validate release identity and package
        if: ${{ !inputs.dry_run }}
        working-directory: plugin
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          sh scripts/verify-release-version.sh "$TAG"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-format
          make vet
          make test
          make verify-package
          PACKAGE_FILE="$(make -s package-file)"
          sh scripts/verify-release-version.sh "$TAG" "$PACKAGE_FILE"

      - name: Commit and tag validated release metadata
        if: ${{ !inputs.dry_run }}
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml Makefile README.md CHANGELOG.md
          git commit -m "release: $VERSION"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$TAG"

  publish:
    name: Verify package and publish release
    needs: prepare
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.prepare.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin
          ref: ${{ github.event_name == 'push' && github.ref || needs.prepare.outputs.tag }}

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev SDK source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kdlbs/kandev
          path: kandev
          ref: ${{ steps.sdk.outputs.ref }}
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Verify release identity and build package
        id: verify
        working-directory: plugin
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          sh scripts/verify-release-version.sh "$TAG"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-format
          make vet
          make test
          make verify-package
          PACKAGE_FILE="$(make -s package-file)"
          sh scripts/verify-release-version.sh "$TAG" "$PACKAGE_FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract checksums
        working-directory: plugin
        env:
          PACKAGE_FILE: ${{ steps.verify.outputs.package }}
        run: |
          set -euo pipefail
          tar -xOzf "$PACKAGE_FILE" checksums.txt > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          files: |
            plugin/${{ steps.verify.outputs.package }}
            plugin/checksums.txt
          generate_release_notes: true
