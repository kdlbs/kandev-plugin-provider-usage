id: "kandev-provider-usage"
api_version: 1
version: "0.8.2"
display_name: "Provider Usage"
description: "Subscription utilization for your agent providers — how much of each rate-limit window (5-hour / weekly / monthly) is used, with reset times and Codex manual reset credits. View usage in the shared top bar (including Threads), session top bar, or phone listing menu; the selected provider is remembered locally. Data comes from the codexbar CLI (plus Augment's Analytics API)."
author: "kandev"
categories: ["analytics"]
repo_url: "https://github.com/kdlbs/kandev-plugin-provider-usage"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Read-only access to kandev sessions so the backend can map the composer's
# kandev session id to the agent it runs, and from there to a codexbar provider
# (claude / codex / gemini / ...). The UI only ever sends kandev ids; the
# session -> provider resolution happens server-side.
capabilities:
  api_read: ["sessions"]
  state: true # Remember the selected Cursor team across restarts and upgrades.

webhooks:
  - key: "discovery"
    description: "Scan local provider connections without waiting for remote usage checks."
    method: "GET"
    access: authenticated
  - key: "cursor-teams"
    description: "List the signed-in Cursor account's teams by name and the saved selection."
    method: "GET"
    access: authenticated
  - key: "cursor-team"
    description: "Save a verified Cursor team selection and refresh its usage."
    method: "POST"
    access: authenticated
  - key: "update"
    description: "Update the managed CodexBar CLI to the latest stable release, verify it and persist the selection (POST)."
    method: "POST"
  - key: "status"
    description: "codexbar CLI install status: resolved command, source, version — or the failure stage, error and fix hint when it can't run (GET; ?refresh=1 re-probes)"
    method: "GET"
  - key: "providers"
    description: "Subscription utilization for every configured provider as JSON (GET; ?refresh=1 bypasses the cache)"
    method: "GET"
    access: authenticated
  - key: "session"
    description: "Subscription utilization for the current session's provider (GET; ?task_id=&active=&refresh=1)"
    method: "GET"
  - key: "overview"
    description: "All providers plus the current session's provider, for the chat-top-bar panel (GET; ?task_id=&active=&refresh=1)"
    method: "GET"

ui:
  bundle: "/ui/bundle.js"

# Operator settings (Settings > Plugins > Provider Usage). Read through the Host
# GetConfig RPC on every webhook call; kandev restarts the plugin whenever the
# operator saves, so changes take effect immediately.
config_schema:
  type: object
# The custom editor groups these fields by detected provider; the schema
# remains the host's validation, masking and fallback-form contract.
  properties:
    # ── Augment (optional) ────────────────────────────────────────────────
    augment_api_token:
      type: string
      format: password
      secret: true
      title: "Augment · API token"
      description: >-
        Optional. Create an Analytics token at
        https://app.augmentcode.com/settings/personal-api-tokens. Stored as a secret.
    augment_email:
      type: string
      title: "Augment · Account email"
      description: "Your Augment org email, used to filter Analytics to your usage."
    augment_monthly_budget:
      type: number
      title: "Augment · Monthly budget"
      description: >-
        Leave empty to use your Analytics budget, or the plan's default allowance.
    augment_resource:
      type: string
      enum: ["credits", "usd"]
      default: "credits"
      title: "Augment · Plan unit"
      description: "Whether your Augment plan is billed in credits or USD."

    # ── Cursor (optional override) ────────────────────────────────────────
    cursor_cookie_header:
      type: string
      format: password
      secret: true
      title: "Cursor · Session cookie"
      description: >-
        Usually empty: uses the Cursor app or CodexBar's manual cookie.
        For a remote host, paste your cursor.com Cookie request header.
        Save before reloading teams. Stored as a secret.

    # ── codexbar (data source) ────────────────────────────────────────────
    codexbar_command:
      type: string
      title: "Usage · CLI command"
      description: >-
        Usually empty: finds or downloads CodexBar automatically.
        Set a path only to use your own CLI.
    codexbar_poll_minutes:
      type: number
      default: 5
      title: "Usage · Refresh every (minutes)"
      description: "How often usage refreshes in the background. Default 5, minimum 1."
    codexbar_providers:
      type: string
      title: "Usage · Providers"
      description: >-
        Leave empty for automatic detection, or enter names separated by commas
        (for example, claude,codex,cursor). "all" checks every provider.
    disabled_providers:
      type: string
      title: "Usage · Disabled providers"
      description: "Managed by the Show usage switch in each provider's section."

    # ── Display ───────────────────────────────────────────────────────────
    display_pill_providers:
      type: string
      title: "Display · Status bar providers"
      description: >-
        Leave empty for the current session's provider. Use "all" or names
        separated by commas. The top bar remembers its own tab selection.
    display_status_bar_mode:
      type: string
      enum: ["off", "percentage", "meter", "both"]
      default: "off"
      title: "Display · Status bar"
      description: >-
        Optional percentage, meter, or both in the status bar and phone drawer.
        Usage is always available in the top bar.
    display_threshold_warn:
      type: number
      default: 75
      title: "Display · Warn threshold (%)"
      description: "A window at or above this turns amber. Default 75."
    display_threshold_high:
      type: number
      default: 90
      title: "Display · High threshold (%)"
      description: "A window at or above this turns red. Default 90."
